<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Incidents | AI Traffic Management</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .incident-container {
            padding: 30px;
        }

        .incident-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .incident-header h1 {
            margin: 0;
        }

        .admin-badge {
            padding: 8px 15px;
            border-radius: 20px;
            background: #2563eb;
        }

        .incident-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .incident-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border-left: 5px solid #ef4444;
        }

        .incident-card h3 {
            margin-top: 0;
        }

        .incident-card p {
            color: #cbd5e1;
        }

        .severity {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            background: #dc2626;
            font-size: 12px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            background: #16a34a;
            font-size: 12px;
            margin-left: 5px;
        }

        .no-incidents {
            text-align: center;
            padding: 50px;
            background: #1e293b;
            border-radius: 12px;
        }

        .error-message {
            text-align: center;
            padding: 30px;
            background: #7f1d1d;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="incident-container">

    <div class="incident-header">

        <div>
            <h1>Traffic Incidents</h1>
            <p>Admin Incident Monitoring</p>
        </div>

        <div class="admin-badge">
            ADMIN
        </div>

    </div>

    <div id="incidentContainer">
        Loading incidents...
    </div>

</div>

<script src="/static/js/incident.js"></script>

</body>
</html>
