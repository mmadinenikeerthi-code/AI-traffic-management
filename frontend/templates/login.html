<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Traffic Management System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #172554 0%, transparent 35%),
                radial-gradient(circle at bottom right, #064e3b 0%, transparent 35%),
                #020617;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            font-size: 32px;
        }

        .system-title {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .system-subtitle {
            color: #94a3b8;
            font-size: 14px;
        }

        .form-label {
            color: #cbd5e1;
            font-weight: 600;
        }

        .form-control,
        .form-select {
            background: #020617;
            border: 1px solid #334155;
            color: white;
            min-height: 48px;
        }

        .form-control:focus,
        .form-select:focus {
            background: #020617;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.15);
        }

        .form-select option {
            background: #020617;
            color: white;
        }

        .login-btn {
            min-height: 50px;
            border-radius: 10px;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #0891b2);
            border: none;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .role-info {
            display: none;
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.25);
            color: #93c5fd;
            font-size: 13px;
        }

        .error-box {
            display: none;
            border-radius: 8px;
            padding: 12px;
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #fca5a5;
            font-size: 14px;
        }

        .success-box {
            display: none;
            border-radius: 8px;
            padding: 12px;
            background: rgba(22, 163, 74, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #86efac;
            font-size: 14px;
        }

        .register-link {
            color: #60a5fa;
            text-decoration: none;
        }

        .register-link:hover {
            color: #93c5fd;
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- Logo -->
        <div class="text-center mb-4">

            <div class="logo mb-3">
                <i class="fa-solid fa-traffic-light"></i>
            </div>

            <h3 class="system-title mb-1">
                AI Traffic Management
            </h3>

            <div class="system-subtitle">
                Traffic Intelligence & Management System
            </div>

        </div>


        <!-- Login Form -->
        <form id="loginForm">

            <!-- Username -->
            <div class="mb-3">

                <label class="form-label">
                    <i class="fa-solid fa-user me-2"></i>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >

            </div>


            <!-- Password -->
            <div class="mb-3">

                <label class="form-label">
                    <i class="fa-solid fa-lock me-2"></i>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <!-- ROLE -->
            <div class="mb-3">

                <label class="form-label">

                    <i class="fa-solid fa-user-shield me-2"></i>

                    Login As

                </label>

                <select
                    id="role"
                    name="role"
                    class="form-select"
                    required
                >

                    <option value="">
                        Select your role
                    </option>

                    <option value="Admin">
                        Admin
                    </option>

                    <option value="Supervisor">
                        Traffic Supervisor
                    </option>

                    <option value="Traffic Officer">
                        Traffic Officer
                    </option>

                </select>


                <!-- Role explanation -->
                <div id="roleInfo" class="role-info"></div>

            </div>


            <!-- Error -->
            <div
                id="errorBox"
                class="error-box mb-3">
            </div>


            <!-- Success -->
            <div
                id="successBox"
                class="success-box mb-3">
            </div>


            <!-- Login button -->
            <button
                type="submit"
                id="loginBtn"
                class="btn btn-primary login-btn w-100"
            >

                <i class="fa-solid fa-right-to-bracket me-2"></i>

                Login

            </button>

        </form>


        <!-- Register -->
        <div class="text-center mt-4">

            <span class="text-secondary">
                Don't have an account?
            </span>

            <a
                href="/register"
                class="register-link ms-1"
            >
                Register
            </a>

        </div>

    </div>

</div>


<script>

const loginForm = document.getElementById("loginForm");

const usernameInput = document.getElementById("username");

const passwordInput = document.getElementById("password");

const roleInput = document.getElementById("role");

const loginBtn = document.getElementById("loginBtn");

const errorBox = document.getElementById("errorBox");

const successBox = document.getElementById("successBox");

const roleInfo = document.getElementById("roleInfo");


// =====================================================
// ROLE INFORMATION
// =====================================================

roleInput.addEventListener("change", function () {

    const role = this.value;

    roleInfo.style.display = "none";
    roleInfo.innerHTML = "";

    if (role === "Admin") {

        roleInfo.innerHTML =
            '<i class="fa-solid fa-shield-halved me-2"></i>' +
            '<strong>Admin:</strong> Full system access including incident management, reports, analytics and alerts.';

        roleInfo.style.display = "block";

    }

    else if (role === "Supervisor") {

        roleInfo.innerHTML =
            '<i class="fa-solid fa-user-tie me-2"></i>' +
            '<strong>Traffic Supervisor:</strong> Dashboard, traffic analytics, alerts and reports.';

        roleInfo.style.display = "block";

    }

    else if (role === "Traffic Officer") {

        roleInfo.innerHTML =
            '<i class="fa-solid fa-road me-2"></i>' +
            '<strong>Traffic Officer:</strong> Normal traffic dashboard and alerts.';

        roleInfo.style.display = "block";

    }

});


// =====================================================
// SHOW ERROR
// =====================================================

function showError(message) {

    errorBox.innerHTML =
        '<i class="fa-solid fa-circle-exclamation me-2"></i>' +
        message;

    errorBox.style.display = "block";

    successBox.style.display = "none";
}


// =====================================================
// SHOW SUCCESS
// =====================================================

function showSuccess(message) {

    successBox.innerHTML =
        '<i class="fa-solid fa-circle-check me-2"></i>' +
        message;

    successBox.style.display = "block";

    errorBox.style.display = "none";
}


// =====================================================
// LOGIN
// =====================================================

loginForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    errorBox.style.display = "none";
    successBox.style.display = "none";


    const username = usernameInput.value.trim();

    const password = passwordInput.value;

    const selectedRole = roleInput.value;


    // Validate role

    if (!selectedRole) {

        showError("Please select your login role.");

        return;
    }


    // Disable button

    loginBtn.disabled = true;

    loginBtn.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>' +
        'Logging in...';


    try {

        // FastAPI OAuth2 login
        const formData = new URLSearchParams();

        formData.append("username", username);

        formData.append("password", password);


        const response = await fetch("/auth/login", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },

            body: formData

        });


        const data = await response.json();


        if (!response.ok) {

            let message = "Login failed.";

            if (data.detail) {

                if (Array.isArray(data.detail)) {

                    message = data.detail
                        .map(error => error.msg)
                        .join(", ");

                } else {

                    message = data.detail;

                }

            }

            throw new Error(message);

        }


        // =================================================
        // SAVE TOKEN
        // =================================================

        const token =
            data.access_token ||
            data.token;


        if (!token) {

            throw new Error(
                "Login succeeded but no access token was returned."
            );

        }


        localStorage.setItem(
            "access_token",
            token
        );

        localStorage.setItem(
            "token",
            token
        );


        // =================================================
        // SAVE USERNAME
        // =================================================

        localStorage.setItem(
            "username",
            username
        );


        // =================================================
        // SAVE SELECTED ROLE
        // =================================================

        localStorage.setItem(
            "user_role",
            selectedRole
        );


        // Also save complete user information

        localStorage.setItem(
            "user",
            JSON.stringify({

                username: username,

                role: selectedRole

            })
        );


        // =================================================
        // SUCCESS
        // =================================================

        showSuccess(
            "Login successful. Opening your dashboard..."
        );


        // =================================================
        // REDIRECT
        // =================================================

        setTimeout(function () {

            window.location.href = "/dashboard";

        }, 700);


    }

    catch (error) {

        console.error(
            "Login error:",
            error
        );

        showError(
            error.message ||
            "Unable to login. Please try again."
        );


        loginBtn.disabled = false;

        loginBtn.innerHTML =
            '<i class="fa-solid fa-right-to-bracket me-2"></i>' +
            'Login';

    }

});

</script>
<script src="/static/js/login.js"></script>
</body>
</html>
